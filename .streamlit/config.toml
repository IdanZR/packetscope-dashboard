[theme]
primaryColor = "#25A794"
font = "sans serif"
baseRadius = "large"

[theme.light]
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C2B43"
dataframeHeaderBackgroundColor = "#EAF0F6"
dataframeBorderColor = "#DCE4EE"
codeBackgroundColor = "#EDF2F7"

[theme.dark]
primaryColor = "#38BDAA"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#132035"
textColor = "#E6EDF7"
dataframeHeaderBackgroundColor = "#1A2A41"
dataframeBorderColor = "#293A51"
codeBackgroundColor = "#101C2D"

[server]
address = "127.0.0.1"
maxUploadSize = 100

[browser]
gatherUsageStats = false
